# TriageOps nginx site. This file is a template with three placeholders:
#   ${DOMAIN}        public hostname, e.g. triageops.example.co.uk
#   ${APP_UPSTREAM}  app:8000 under docker compose, 127.0.0.1:8000 under systemd
#   ${WEB_ROOT}      folder holding the built SPA (dist)
#
# Docker renders it automatically (official nginx image, /etc/nginx/templates).
# On a host install render it once:
#   DOMAIN=example.com APP_UPSTREAM=127.0.0.1:8000 WEB_ROOT=/var/www/triageops \
#     envsubst '${DOMAIN} ${APP_UPSTREAM} ${WEB_ROOT}' < triageops.conf > /etc/nginx/sites-available/triageops.conf
#
# Everything below lives inside the http {} context (conf.d or sites-enabled).

# ---------- rate limiting (per client IP, in front of the app's own limits) ----------
limit_req_zone $binary_remote_addr zone=triageops_demo:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=triageops_chat:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=triageops_api:10m rate=10r/s;

upstream triageops_app {
    server ${APP_UPSTREAM};
    keepalive 16;
}

# ---------- port 80: ACME challenges, then redirect everything to HTTPS ----------
server {
    # IPv4 listens only. Inside Docker the host's port mapping already accepts IPv6
    # clients, and a [::] listen fails in containers without IPv6. On a host install
    # with IPv6, add "listen [::]:80;" and "listen [::]:443 ssl http2;".
    listen 80;
    server_name ${DOMAIN};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- port 443: the application ----------
server {
    # "listen ... http2" works on nginx 1.24 (Ubuntu 24.04 apt) and 1.27 (docker image).
    listen 443 ssl http2;
    server_name ${DOMAIN};
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TriageOpsTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling. Let's Encrypt stopped running OCSP responders in 2025.

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;

    # ---------- security headers (edge is the single source on the VPS) ----------
    # Hide the copies the app sets itself (it needs them on Vercel), so browsers see one of each.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Note: any add_header inside a location would drop the headers above (nginx
    # inheritance rule). Locations below use "expires" for caching for that reason.

    # ---------- compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/json application/javascript text/javascript application/xml image/svg+xml;

    # ---------- proxy defaults, inherited by every /api location ----------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append) so a client cannot spoof its IP for rate limiting.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    # Triage and the copilot call Claude synchronously, so allow up to a minute.
    proxy_read_timeout 60s;
    proxy_next_upstream off;

    # ---------- API ----------
    location ^~ /api/demo/ {
        limit_req zone=triageops_demo burst=3 nodelay;
        proxy_pass http://triageops_app;
    }

    location = /api/chat {
        limit_req zone=triageops_chat burst=6 nodelay;
        proxy_pass http://triageops_app;
    }

    location /api/ {
        limit_req zone=triageops_api burst=40 nodelay;
        proxy_pass http://triageops_app;
    }

    # ---------- static SPA ----------
    root ${WEB_ROOT};
    index index.html;

    # Vite fingerprints everything under /assets, so it can be cached for a year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html must always revalidate so a new deploy is picked up at once.
    location = /index.html {
        expires -1;
    }

    # Never serve dotfiles (.env, .git) even if one lands in the web root by mistake.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Client side routes (/build, /ticket/TKT-...) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
